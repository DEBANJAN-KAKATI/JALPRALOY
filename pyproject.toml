[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jalproloi"
version = "0.1.0"
description = "Heavy-rainfall early warning and inundation prediction for Assam"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["pipelines*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
